<script>
// Tema por horario (no sigue el modo del iPhone): oscuro de 19:00 a 06:00 por defecto
function isNight(from, to, d) {
  from = from || '19:00'; to = to || '06:00'; d = d || new Date();
  if (from === to) return false;
  var h = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  return from < to ? (h >= from && h < to) : (h >= from || h < to);
}
(function () {
  try {
    var st = (JSON.parse(localStorage.getItem('finanzas.v1') || 'null') || {}).settings || {};
    if (isNight(st.darkFrom, st.darkTo)) {
      document.documentElement.classList.add('night');
      document.querySelector('meta[name=theme-color]').content = '#0e0e0e';
      document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]').content = 'black-translucent';
    }
  } catch (e) {}
})();
</script>

<style>
/* Mismo estilo que Paso: claro de día, oscuro de noche (por horario, no por el modo del iPhone) */
:root{
  --bg:#f4f3f1; --card:#fff; --card2:#fff; --soft:#ebeae7; --line:#e6e4e0; --line2:#d6d3ce;
  --ink:#141414; --text:#1b1b1b; --muted:#7c7a76; --dim:#adaaa5;
  --gold:var(--ink); --gold2:var(--ink);
  --red:#d6453d; --green:#2f9e6b; --amber:#c9781a; --pink:#f0405a;
  --onink:#fff; --field:#fafaf9; --navbg:rgba(244,243,241,.9); --toastbg:rgba(255,255,255,.96);
  --ringbg:#e9e7e3; --barlight:#d9d7d3; --shadow:rgba(0,0,0,.12); --tint:rgba(0,0,0,.035);
  --r:20px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
html.night{
  --bg:#0e0e0e; --card:#181818; --card2:#181818; --soft:#232323; --line:#262626; --line2:#383838;
  --ink:#f2f2f0; --text:#ececea; --muted:#9a9894; --dim:#5f5e5b;
  --red:#ff7a6e; --green:#4cc38a; --amber:#f0a443;
  --onink:#111; --field:#1f1f1f; --navbg:rgba(14,14,14,.88); --toastbg:rgba(34,34,34,.96);
  --ringbg:#2a2a2a; --barlight:#3a3a3a; --shadow:rgba(0,0,0,.5); --tint:rgba(255,255,255,.04);
  color-scheme:dark;
}
html{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);transition:background-color .3s}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:640px;margin:0 auto;padding:calc(var(--top) + 14px) 16px calc(var(--bot) + 110px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 16px}

.sub{color:var(--muted);font-size:13px}
.lbl{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.card h2 a,.card h2 button{color:var(--ink);font-size:14px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:6px;white-space:nowrap}
.kpi .v small,.big small{font-size:.6em;color:var(--muted);font-weight:600}
.kpi.hero{background:var(--soft);border-color:var(--soft)}

.kpi .note{font-size:13px;color:var(--muted);margin-top:4px}
.cycle{display:flex;align-items:center;gap:6px}

.cycle span{font-size:13px;color:var(--muted);min-width:96px;text-align:center;font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:6px}
.bar.warn>i{background:var(--amber)} .bar.over>i{background:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}

.info{font-size:13px;color:var(--text);background:var(--soft);border-radius:14px;padding:12px 14px;line-height:1.5}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(var(--bot) + 6px)}

.fab{position:fixed;z-index:21;right:max(18px,calc(50% - 302px));bottom:calc(var(--bot) + 78px);width:58px;height:58px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(240,64,90,.38)}

.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility .25s;padding:10px 18px calc(var(--bot) + 20px);box-shadow:0 -10px 40px var(--shadow)}

select.inp{-webkit-appearance:none;appearance:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warnmsg{margin-top:10px;font-size:13px;color:var(--amber)}
.mt{margin-top:16px}.mt8{margin-top:8px}

.tblw{overflow-x:auto;margin:12px -4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:11px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line2)}

.sema span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.sema .g{background:var(--green)}.sema .a{background:var(--amber)}.sema .r{background:var(--red)}
.sema>div{margin-left:6px;min-width:0}
.tl-bar{position:relative;display:flex;gap:3px;height:14px;margin:38px 0 8px}
.tl-bar .tseg{border-radius:7px;overflow:hidden;min-width:0}
.tl-bar .tseg.cur{background:var(--barlight)}.tl-bar .tseg.cur i{display:block;height:100%;background:var(--ink)}

.cardhint b{color:var(--ink)}
</style>

<script>
'use strict';
/* ================= Datos ================= */
const KEY = 'finanzas.v1';
const METHODS = ['Efectivo', 'Débito', 'Yape/Plin', 'Tarjeta de crédito', 'Tarjeta alimentos'];
const FOOD_CATS = ['Supermercado', 'Comidas fuera'];
const CASH = ['Efectivo', 'Débito', 'Yape/Plin'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const PALETTE = {
  'Alquiler':'#d9a441','Supermercado':'#4fa08f','Comidas fuera':'#e07b39','Transporte':'#8a6a4a',
  'Suscripciones':'#8f7fc4','Ocio':'#e0b53a','Salud':'#d0607a','Ropa':'#c06b52','Deudas':'#5b6b8c','Otros':'#9b9893'
};
const EXTRA_COLORS = ['#9bb36a','#6f9fc9','#c98fb0','#b8a46a','#7fb8b8','#d4a373'];

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayISO = () => iso(new Date());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const clampDate = (y, m, day) => { const dim = new Date(y, m+1, 0).getDate(); return new Date(y, m, Math.min(day, dim)); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(/\s/g,'').replace(/,(?=\d{1,2}$)/,'.').replace(/,/g,'')); return isFinite(n) ? Math.round(n*100)/100 : NaN; };

/* ================= Ciclos (tu "mes" va del día X al X-1 del siguiente) ================= */
function cycleStartOf(date, day) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const a = clampDate(d.getFullYear(), d.getMonth(), day);
  return d >= a ? a : clampDate(d.getFullYear(), d.getMonth() - 1, day);
}
function nextCycleStart(date, day) {
  const s = cycleStartOf(date, day);
  return clampDate(s.getFullYear(), s.getMonth() + 1, day);
}
function cycle(offset = 0) {
  const day = S.settings.cycleDay;
  let s = cycleStartOf(new Date(), day);
  s = clampDate(s.getFullYear(), s.getMonth() + offset, day);
  const next = clampDate(s.getFullYear(), s.getMonth() + 1, day);
  const e = addDays(next, -1);
  const mid = addDays(s, 15);
  return { start: iso(s), end: iso(e), key: iso(s), label: `${dShort(iso(s))} – ${dShort(iso(e))}`, month: MONTHS[mid.getMonth()], monthL: MONTHS_L[mid.getMonth()], year: mid.getFullYear() };
}
const inCycle = (m, c) => m.date >= c.start && m.date <= c.end;
function dueIn(c, day) {
  const s = parse(c.start);
  const a = clampDate(s.getFullYear(), s.getMonth(), day);
  return iso(a >= s ? a : clampDate(s.getFullYear(), s.getMonth() + 1, day));
}

/* ================= Cálculos ================= */
function totals(c) {
  let inc = 0, exp = 0, food = 0; const byCat = {};
  for (const m of S.movements) {
    if (!inCycle(m, c)) continue;
    if (m.type === 'ingreso') { inc += m.amount; if (m.category === 'Tarjeta alimentos') food += m.amount; }
    else if (m.type === 'gasto') { exp += m.amount; byCat[m.category] = (byCat[m.category] || 0) + m.amount; }
  }
  return { inc, exp, left: inc - exp, food, byCat };
}
/* ---------- Tarjeta de crédito: cierres y pagos (cronograma BCP, cierre 25) ---------- */
const BCP_2026 = [
  ['2026-01-23','2026-02-23'],['2026-02-25','2026-03-23'],['2026-03-25','2026-04-21'],['2026-04-24','2026-05-20'],
  ['2026-05-25','2026-06-22'],['2026-06-25','2026-07-21'],['2026-07-24','2026-08-20'],['2026-08-25','2026-09-22'],
  ['2026-09-25','2026-10-20'],['2026-10-23','2026-11-23'],['2026-11-25','2026-12-22'],['2026-12-24','2027-01-20']

const weekdayBack = d => { while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, -1); return d; };
const weekdayFwd = d => { while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1); return d; };
function cardSchedule() {
  const known = (S.card.schedule || BCP_2026).map(([close, pay]) => ({ close, pay, approx: false }));
  const out = [...known];
  // meses sin cronograma: cierre ~25 (día hábil anterior), pago ~20 del mes siguiente (aprox., conservador)
  let last = parse(out[out.length - 1].close);
  const limit = addDays(new Date(), 400);
  while (last < limit) {
    const close = weekdayBack(clampDate(last.getFullYear(), last.getMonth() + 1, S.card.closeDay || 25));
    const pay = weekdayFwd(clampDate(close.getFullYear(), close.getMonth() + 1, 20));
    out.push({ close: iso(close), pay: iso(pay), approx: true });
    last = close;
  }
  out.forEach((p, i) => { p.start = i ? iso(addDays(parse(out[i - 1].close), 1)) : iso(addDays(parse(p.close), -30)); });
  return out;
}
function periodOf(dateISO) {
  const sch = cardSchedule();
  return sch.find(p => p.close >= dateISO) || sch[sch.length - 1];
}
// Estados de cuenta: consumo de cada periodo y cuánto falta pagar (los pagos se aplican al más antiguo)
function cardStatements() {
  const C = S.card, map = new Map();
  const get = close => { if (!map.has(close)) { const p = cardSchedule().find(x => x.close === close) || periodOf(close); map.set(close, { ...p, amount: 0 }); } return map.get(close); };
  if (C.openBase) get(C.openClose).amount += C.openBase;
  if (C.prevBase) get(C.prevClose).amount += C.prevBase;
  let payments = 0;
  for (const m of S.movements) {
    if ((m.created || 0) <= C.baseAt) continue;
    if (m.type === 'gasto' && m.method === 'Tarjeta de crédito') get(periodOf(m.date).close).amount += m.amount;
    if (m.type === 'pago_tarjeta') payments += m.amount;
  }
  const today = todayISO();
  const list = [...map.values()].sort((a, b) => a.close.localeCompare(b.close));
  for (const s of list) {
    s.amount = Math.round(s.amount * 100) / 100;
    const p = Math.min(payments, s.amount); s.paid = p; payments -= p;
    s.left = Math.round((s.amount - p) * 100) / 100;
    s.closed = today > s.close;
  }

}
function cardInfo() {

  const due = list.filter(s => s.closed && s.left > 0);
  const total = Math.round((list.reduce((a, s) => a + s.left, 0) - extra) * 100) / 100;

function cardBalance() { return cardInfo().total; }

// Cuándo pagas un estado de cuenta: con tu sueldo (primer día de cobro después del cierre) o en la fecha del banco
function plannedPay(p) {

  const day = S.settings.cycleDay, c = parse(p.close);
  let d = clampDate(c.getFullYear(), c.getMonth(), day);

}

function foodBalance() {

// Dinero que tienes de verdad: efectivo + cuenta + Yape/Plin (las compras con tarjeta no lo bajan hasta que pagas la tarjeta)
function cashBalance() {
  let b = 0;
  for (const m of S.movements) {
    if (m.type === 'ingreso' && m.category !== 'Tarjeta alimentos') b += m.amount;
    else if (m.type === 'gasto' && CASH.includes(m.method) && !m.goalId) b -= m.amount;
    else if (m.type === 'pago_tarjeta') b -= m.amount;

const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
// Lo que entra y sale de tu saldo desde hoy hasta fin de mes
// ¿ya está pagado este gasto fijo en ese mes? La cuota del crédito también cuenta si la registraste desde Deudas
function fixedMov(f, c) {
  return S.movements.find(m => (m.fixedId === f.id && m.cycleKey === c.key)
    || (f.loan && m.loan === 'cuota' && m.date >= c.start && m.date <= c.end));
}
function cycleFromKey(ck) {
  const d = parse(ck), next = clampDate(d.getFullYear(), d.getMonth() + 1, S.settings.cycleDay);
  return { start: ck, end: iso(addDays(next, -1)), key: ck };
}
// ¿ya registraste este ingreso para el mes que empieza en ck? (con el botón o a mano con la misma categoría)
function incomeRegistered(i, ck) {
  const c = cycleFromKey(ck);
  return S.movements.some(m => m.type === 'ingreso' && ((m.incomeId === i.id && m.cycleKey === ck) || (m.category === i.category && m.date >= c.start && m.date <= c.end)));
}
// gastos fijos (de tu cuenta) y pagos de tarjeta entre dos fechas
function outflows(from, to) {
  const out = [];
  for (const c of [cycle(0), cycle(1), cycle(2)]) {
    if (c.start < S.startFrom) continue;
    for (const f of S.fixed) {
      if (!f.active || !(f.amount > 0) || !CASH.includes(f.method)) continue;
      const due = dueIn(c, f.day);
      if (due < from || due > to) continue;
      if (S.skips.includes(f.id + '|' + c.key) || fixedMov(f, c)) continue;
      out.push({ label: f.name, date: due, amount: -f.amount, note: dShort(due), color: colorOf(f.category) });
    }
  }
  for (const s of cardStatements().list) {
    const plan = plannedPay(s);
    if (s.left <= 0 || plan > to) continue;
    const late = s.pay < from, behind = !late && plan < from;
    out.push({ label: 'Pago tarjeta de crédito', date: late || behind ? from : plan, amount: -s.left,
      note: late ? 'VENCIDO el ' + dShort(s.pay) : (S.card.payMode === 'banco' ? dShort(plan) : 'con tu sueldo') + (s.closed ? ' · vence ' + dShort(s.pay) : ' · suma hasta el ' + dShort(s.close)),
      color: late ? 'var(--red)' : 'var(--amber)' });
  }
  return out;
}
// Lo que entra y sale de tu saldo desde hoy hasta fin de mes, y cuánto puedes gastar al día
function upcoming() {
  const now = new Date(), today = todayISO(), day = S.settings.cycleDay;
  const monthEnd = iso(new Date(now.getFullYear(), now.getMonth() + 1, 0));
  const cur = cycle(0), nxt = cycle(1);
  // sueldo e ingresos esperados (no la tarjeta de alimentos, que no es saldo)
  const payISO = iso(clampDate(now.getFullYear(), now.getMonth(), day));
  const payCk = iso(cycleStartOf(parse(payISO), day));
  const pend = [];
  if ((payISO > today || payCk === cur.key) && payCk >= S.startFrom) {
    for (const i of S.incomes) {
      if (!(i.amount > 0) || i.category === 'Tarjeta alimentos' || incomeRegistered(i, payCk)) continue;
      pend.push({ label: i.name, date: payISO, amount: i.amount, note: payISO > today ? 'aprox. ' + dShort(payISO) : 'por llegar', color: 'var(--green)' });
    }
  }
  const salaryPending = pend.length > 0;
  // un sueldo que llegó antes se registra con fecha de inicio de tu mes: queda reservado hasta ese día
  const futureInc = S.movements.filter(m => m.type === 'ingreso' && m.category !== 'Tarjeta alimentos' && m.date > today).map(m => m.date).sort()[0] || null;
  let horizon, hastaTxt;
  if (futureInc) { horizon = futureInc; hastaTxt = 'el inicio de tu mes (' + dShort(futureInc) + ')'; }
  else if (salaryPending && payISO > today) { horizon = payISO; hastaTxt = 'tu sueldo (' + dShort(payISO) + ')'; }
  else if (salaryPending) { horizon = iso(addDays(parse(monthEnd), 1)); hastaTxt = 'fin de mes'; }
  else { horizon = nxt.start; hastaTxt = 'tu próximo sueldo (~' + dShort(nxt.start) + ')'; }
  const lastDay = iso(addDays(parse(horizon), -1));
  const outs = outflows(today, lastDay > monthEnd ? lastDay : monthEnd);
  const items = [...pend, ...outs.filter(x => x.date <= monthEnd)].sort((a, b) => a.date.localeCompare(b.date) || b.amount - a.amount);
  const cash = cashBalance(), cashToday = cashAt(today);

  const days = Math.max(1, daysBetween(today, horizon));
  return { items, monthEnd, cash, reserved: Math.round((cash - cashToday) * 100) / 100, end, horizon, hastaTxt, spendable, days, daily: Math.max(0, spendable) / days, salaryPending, futureInc };

/* ---------- Gasto diario con acumulado: monto fijo por día; lo que no gastas pasa a mañana ---------- */
const isDaily = m => m.type === 'gasto' && CASH.includes(m.method) && !m.fixedId && !m.loan && !m.goalId;
function dailyBudget() {
  const u = upcoming(), today = todayISO();
  const sig = S.movements.filter(m => m.type === 'ajuste' || m.type === 'ahorro' || (m.type === 'ingreso' && m.category !== 'Tarjeta alimentos'))
    .reduce((a, m) => a + m.amount, 0).toFixed(2) + '|' + u.horizon;
  let P = S.dailyPlan;
  if (!P || today < P.start || today >= P.end || P.sig !== sig) {
    // nuevo plan desde hoy: lo gastado hoy cuenta contra el monto de hoy
    const spentToday = S.movements.filter(m => isDaily(m) && m.date === today).reduce((a, m) => a + m.amount, 0);
    const days = Math.max(1, daysBetween(today, u.horizon));
    P = S.dailyPlan = { start: today, end: u.horizon, base: Math.max(0, Math.floor((u.spendable + spentToday) / days * 100) / 100), sig, at: Date.now() };
    save();
  }
  const inPlan = m => isDaily(m) && m.date <= today && (m.date >= P.start || (m.created || 0) > P.at);
  const before = S.movements.filter(m => inPlan(m) && m.date < today).reduce((a, m) => a + m.amount, 0);
  const spentToday = S.movements.filter(m => inPlan(m) && m.date === today).reduce((a, m) => a + m.amount, 0);
  const idx = daysBetween(P.start, today);
  const allowance = Math.round((P.base * (idx + 1) - before) * 100) / 100;   // lo que tenías para hoy
  const left = Math.round((allowance - spentToday) * 100) / 100;            // lo que te queda hoy
  const daysLeft = daysBetween(today, P.end);
  return { u, base: P.base, allowance, carry: Math.round((allowance - P.base) * 100) / 100, spentToday, left, tomorrow: Math.round((left + P.base) * 100) / 100, daysLeft, end: P.end };
}
// Préstamo: TEA → TEM; los "cargos" son la parte fija de la cuota que no es capital ni interés (seguro, etc.)
function loanBase() {
  const L = S.loan, tem = Math.pow(1 + L.tea / 100, 1 / 12) - 1;
  const ann = L.cuotas > 0 ? L.capital * tem / (1 - Math.pow(1 + tem, -L.cuotas)) : 0;
  return { tem, cargos: Math.max(0, Math.min(L.cuota - ann, L.cuota * 0.3)) };
}
function monthsToPay(cap, tem, pay) {
  if (cap <= 0.01) return 0;
  if (pay <= cap * tem) return 999;
  return Math.ceil(-Math.log(1 - cap * tem / pay) / Math.log(1 + tem) - 1e-9);
}
const addMonth = (s, k = 1) => { const d = parse(s); return iso(clampDate(d.getFullYear(), d.getMonth() + k, d.getDate())); };
function loanState() {
  const L = S.loan, { tem, cargos } = loanBase();
  let cap = L.capital, n = L.cuotas, next = L.next, paidCount = 0;
  const pays = S.movements.filter(m => m.loan && (m.created || 0) > L.baseAt).sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created);
  for (const p of pays) {
    if (p.loan === 'cuota') {
      const amort = Math.max(0, p.amount - cargos - cap * tem);
      cap = Math.max(0, cap - amort); n = Math.max(0, n - 1); next = addMonth(next); paidCount++;
    } else if (p.loan === 'anticipado') {
      cap = Math.max(0, cap - p.amount);
      n = Math.min(n, monthsToPay(cap, tem, L.cuota - cargos));
    }
  }
  if (cap < 1) { cap = 0; n = 0; }
  return { cap: Math.round(cap * 100) / 100, n, next, tem, cargos };
}
function simulate(cap, tem, cuota, cargos, extra) {
  let b = cap, m = 0, paid = 0;
  const base = cuota - cargos;
  while (b > 0.005 && m < 120) {
    m++;
    const i = b * tem;
    const pay = Math.min(base, b + i);
    b = b + i - pay; paid += pay + cargos;
    if (b > 0 && extra > 0) { const e = Math.min(extra, b); b -= e; paid += e; }
  }
  return { months: m, paid, cost: paid - cap };
}

/* ================= Fijos automáticos ================= */
function autoFixed() {
  const c = cycle(0);
  if (c.start < S.startFrom) return 0;
  const today = todayISO(); let added = 0;
  for (const f of S.fixed) {
    if (!f.active || !(f.amount > 0)) continue;
    const due = dueIn(c, f.day);
    if (today < due) continue;
    const tag = f.id + '|' + c.key;
    if (S.skips.includes(tag) || fixedMov(f, c)) continue;
    S.movements.push({ id: uid(), type: 'gasto', amount: f.amount, category: f.category, method: f.method, date: due,
      note: f.name, fixedId: f.id, cycleKey: c.key, auto: true, created: Date.now(), ...(f.loan ? { loan: 'cuota' } : {}) });
    added++;

}

let tab = 'inicio', off = 0, movFilter = 'todos';
const $ = s => document.querySelector(s);
function toast(t) { const el = $('#toast'), d = new Date(); $('#toastTime').textContent = `Finanzas · ${pad(d.getHours())}:${pad(d.getMinutes())}`; $('#toastTitle').textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }
function openSheet(html) { $('#sheetBody').innerHTML = html; $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); $('#sheet').scrollTop = 0; }
function closeSheet() { $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); sheetCtx = null; }

function cycleNav() {
  const c = cycle(off);
  return `<div class="cycle"><button data-act="prev" aria-label="Mes anterior">‹</button><span>${c.label}</span><button data-act="next" ${off >= 0 ? 'disabled' : ''} aria-label="Mes siguiente">›</button></div>`;
}
function applyTheme() {
  const night = isNight(S.settings.darkFrom, S.settings.darkTo);
  document.documentElement.classList.toggle('night', night);
  document.querySelector('meta[name=theme-color]').content = night ? '#0e0e0e' : '#f4f3f1';
}
function render() {
  applyTheme();
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#fab').classList.toggle('hide', tab === 'ajustes' || tab === 'analisis');
  $('#app').innerHTML = ({ inicio: vInicio, movs: vMovs, analisis: vAnalisis, deudas: vDeudas, ajustes: vAjustes })[tab]();
  if (tab === 'deudas') updateSim();
}

/* ---------- Inicio ---------- */
function donutBy(byKey, total, colorFn, label = 'gastado') { return donut(byKey, total, colorFn, label); }
function donut(byCat, total, colorFn = colorOf, label = 'gastado') {
  const ents = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (!ents.length) return `<div class="empty">Aún no hay gastos este mes.</div>`;
  const R = 52, C = 2 * Math.PI * R; let acc = 0;
  const arcs = ents.map(([k, v]) => {
    const len = v / total * C; const gap = ents.length > 1 ? Math.min(2, len * 0.3) : 0;
    const s = `<circle r="${R}" cx="66" cy="66" fill="none" stroke="${colorFn(k)}" stroke-width="16" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 66 66)"/>`;
    acc += len; return s;
  }).join('');
  const leg = ents.slice(0, 8).map(([k, v]) => `<div><i style="background:${colorFn(k)}"></i><span>${esc(k)}</span><em>${Math.round(v / total * 100)}%</em></div>`).join('');
  return `<div class="donut"><svg width="132" height="132" viewBox="0 0 132 132"><circle r="${R}" cx="66" cy="66" fill="none" stroke="var(--ringbg)" stroke-width="16"/>${arcs}
    <text x="66" y="66" text-anchor="middle" fill="var(--text)" font-size="17" font-weight="700">${fmt(total, 0).replace('S/ ', 'S/')}</text>
    <text x="66" y="83" text-anchor="middle" fill="var(--muted)" font-size="11">${label}</text></svg><div class="legend">${leg}</div></div>`;
}
function bars() {
  const arr = [];
  for (let k = off - 5; k <= off; k++) { const c = cycle(k); arr.push({ c, v: totals(c).exp, cur: k === off }); }
  const max = Math.max(1, ...arr.map(a => a.v));
  return `<div class="bars">${arr.map(a => `<div class="b ${a.cur ? 'cur' : ''}"><em>${a.v ? Math.round(a.v).toLocaleString('en-US') : ''}</em><i style="height:${Math.max(2, a.v / max * 100)}%"></i><small>${a.c.month}</small></div>`).join('')}</div>`;
}
function movRow(m) {
  if (m.type === 'ahorro') { const g = (S.goals || []).find(x => x.id === m.goalId); return `<div class="row tap" data-act="edit" data-id="${m.id}"><i class="dot" style="background:var(--green)"></i><div class="t"><b>${m.amount >= 0 ? 'Ahorro' : 'Retiro de ahorro'}</b><span>${dShort(m.date)} · ${esc(g ? g.name : 'meta')}</span></div>
    <div class="amt neutral">${m.amount >= 0 ? '→ ' : '← '}${fmt(Math.abs(m.amount))}</div></div>`; }
  if (m.type === 'ajuste') return `<div class="row tap" data-act="edit" data-id="${m.id}"><i class="dot" style="background:#9b9893"></i><div class="t"><b>Ajuste de saldo</b><span>${dShort(m.date)}</span></div>
    <div class="amt neutral">${m.amount >= 0 ? '+' : '−'}${fmt(Math.abs(m.amount))}</div></div>`;
  const isIn = m.type === 'ingreso', isPay = m.type === 'pago_tarjeta';
  const title = isPay ? 'Pago de tarjeta' : m.category;
  const tc = m.type === 'gasto' && m.method === 'Tarjeta de crédito';
  const gName = m.goalId && m.type === 'gasto' ? ((S.goals || []).find(g => g.id === m.goalId) || {}).name : null;
  const sub = [dShort(m.date), m.note, isIn ? null : m.method, gName ? 'de ' + gName : null, m.auto ? 'fijo' : null].filter(Boolean).map(esc).join(' · ')
    + (tc ? ` · <span style="color:var(--gold)">se paga ${S.card.payMode === 'banco' ? dShort(periodOf(m.date).pay) : '~' + dShort(plannedPay(periodOf(m.date)))}</span>` : '');
  const col = isPay ? '#9b9893' : isIn ? 'var(--green)' : colorOf(m.category);
  return `<div class="row tap" data-act="edit" data-id="${m.id}"><i class="dot" style="background:${col}"></i><div class="t"><b>${esc(title)}</b><span>${sub}</span></div>
    <div class="amt ${isIn ? 'in' : isPay ? 'neutral' : ''}">${isIn ? '+' : '−'}${fmt(m.amount).replace('S/ ', 'S/ ')}</div></div>`;
}
function vInicio() {
  const c = cycle(off), t = totals(c), cur = off === 0;
  const now = new Date();
  const ci = cardInfo(), cb = ci.open.amount, capPct = cb / S.card.cap * 100;
  const fb = foodBalance();
  const recent = S.movements.filter(m => inCycle(m, c)).sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created).slice(0, 6);

  // ingresos esperados de este mes
  let pend = '';
  if (cur && c.start >= S.startFrom) {
    const miss = S.incomes.filter(i => i.amount > 0 && !incomeRegistered(i, c.key));
    if (miss.length) pend = `<div class="card"><h2>¿Ya cobraste?</h2><div class="cta">${miss.map(i => `<button class="btn outline sm" data-act="income" data-id="${i.id}">+ ${esc(i.name)} ${fmt(i.amount, 0)}</button>`).join('')}</div></div>`;
  }
  if (cur) {
    const nx = cycle(1);
    if (nx.start >= S.startFrom && daysBetween(todayISO(), nx.start) <= 7) {
      const missN = S.incomes.filter(i => i.amount > 0 && !incomeRegistered(i, nx.key));
      if (missN.length) pend += `<div class="card"><h2>¿Ya te depositaron?</h2><div class="sub" style="margin-bottom:10px">Si tu sueldo llegó antes del ${dShort(nx.start)}, regístralo aquí con el <b>monto real</b>: cuenta para tu mes que empieza el ${dShort(nx.start)} y no infla tu gasto de estos días.</div>
        <div class="cta">${missN.map(i => `<button class="btn outline sm" data-act="income" data-next="1" data-id="${i.id}">+ ${esc(i.name)}</button>`).join('')}</div></div>`;
    }
  }
  const firstUse = !S.movements.length ? `<div class="card info">Empieza tocando <b>Saldo disponible</b> para poner cuánto dinero tienes hoy (efectivo + cuenta + Yape). Desde el <b>${dShort(S.startFrom)}</b> tus gastos fijos se apuntan solos y aquí te aparecerá el botón para registrar tu sueldo.</div>` : '';

  // saldo y proyección a fin de mes (solo en el mes actual)
  let now2 = '';
  if (cur) {
    const D = dailyBudget(), u = D.u;
    const hasta = u.hastaTxt;
    const dailyTxt = u.spendable < 0
      ? `<span style="color:var(--red)">Te faltan ${fmt(-u.spendable, 0)} para cubrir lo pendiente${u.salaryPending ? ' antes del sueldo' : ''}</span>`
      : `Base: <b style="color:var(--text)">${fmt(D.base)} al día</b> hasta ${hasta}`;
    const pct = D.allowance > 0 ? Math.min(100, D.spentToday / D.allowance * 100) : 100;
    const todayCard = u.spendable < 0 ? '' : `<div class="card"><h2>Hoy puedes gastar <span class="pill">${D.daysLeft} día${D.daysLeft > 1 ? 's' : ''} hasta el ${dShort(u.horizon)}</span></h2>
      <div class="big" style="color:${D.left < 0 ? 'var(--red)' : 'var(--gold2)'}">${D.left < 0 ? 'Te pasaste ' + fmt(-D.left) : fmtH(D.left)}</div>
      <div class="sub">${fmt(D.base)} diarios ${D.carry > 0.004 ? `<span style="color:var(--green)">+ ${fmt(D.carry)} que te sobró</span>` : D.carry < -0.004 ? `<span style="color:var(--red)">− ${fmt(-D.carry)} que te pasaste</span>` : ''}${D.spentToday ? ` · gastaste hoy ${fmt(D.spentToday)}` : ''}</div>
      <div class="bar ${D.left < 0 ? 'over' : pct >= 80 ? 'warn' : ''}"><i style="width:${pct}%"></i></div>
      <div class="note sub mt8">${D.daysLeft > 1 ? `Si no gastas más hoy, mañana tendrás <b style="color:var(--text)">${fmt(D.tomorrow)}</b>.` : 'Hoy es el último día antes de ' + hasta + '.'}</div>
      <div class="sub mt8" style="font-size:12px">Cuenta lo que pagas en efectivo, débito o Yape/Plin (no la tarjeta de crédito, que tiene su tope, ni los gastos fijos).</div></div>`;
    const line = (dot, label, note, amt, cls = '') => `<div class="row"><i class="dot" style="background:${dot}"></i><div class="t"><b>${esc(label)}</b>${note ? `<span>${esc(note)}</span>` : ''}</div><div class="amt ${cls}">${amt}</div></div>`;
    now2 = `<div class="card kpi hero tap" data-act="setcash"><div class="lbl">Saldo disponible</div><div class="v ${u.cash >= 0 ? 'pos' : ''}">${fmtH(u.cash)}</div>
        <div class="note">efectivo + cuenta + Yape/Plin · <span style="color:var(--gold)">toca para ajustar</span></div>${u.reserved > 0 ? `<div class="note" style="margin-top:4px">incluye <b style="color:var(--text)">${fmt(u.reserved, 0)}</b> de tu sueldo, reservado para tu mes desde el ${dShort(u.futureInc)}</div>` : ''}<div class="note" style="margin-top:8px">${dailyTxt}</div></div>${todayCard}
      <div class="card"><h2>Hasta fin de mes · ${dShort(u.monthEnd)}</h2>
        ${line('var(--muted)', 'Saldo hoy', '', fmt(u.cash))}
        ${u.items.map(x => line(x.color, x.label, x.note, (x.amount > 0 ? '+' : '−') + fmt(Math.abs(x.amount)), x.amount > 0 ? 'in' : '')).join('')}
        ${u.items.length ? '' : `<div class="sub" style="padding:6px 0 10px">No tienes pagos pendientes antes del ${dShort(u.monthEnd)}.</div>`}
        <div class="row" style="border-top:1px solid var(--line2)"><div class="t"><b style="font-size:16px">Te quedaría</b><span>al ${dShort(u.monthEnd)}, sin contar gastos nuevos</span></div><div class="amt" style="font-size:19px;color:${u.end < 0 ? 'var(--red)' : 'var(--ink)'}">${fmt(u.end)}</div></div>
        <div class="sub mt8">Tus compras con tarjeta de crédito no bajan tu saldo hoy: salen el día que pagas la tarjeta.</div>
        ${(() => {
          const nx = cardStatements().list.find(s => s.left > 0 && plannedPay(s) > u.monthEnd);
          return nx ? `<div class="sub mt8">Siguiente pago de tarjeta: <b style="color:var(--text)">${fmt(nx.left, 0)}</b>${nx.closed ? '' : ' y sumando hasta el ' + dShort(nx.close)}, ${payTxt(nx)}.</div>` : '';
        })()}
      </div>`;
  }

  // fijos
  let fx = '';
  const showFixed = S.fixed.filter(f => f.active);
  if (showFixed.length && off >= 0) {
    const before = c.start < S.startFrom;
    fx = `<div class="card"><h2>Gastos fijos · ${c.monthL} <button data-act="goto" data-v="ajustes">Editar</button></h2>${showFixed.map(f => {
      const due = dueIn(c, f.day);
      const m = fixedMov(f, c);
      let pill;
      if (!(f.amount > 0)) pill = `<span class="pill miss">pon el monto</span>`;
      else if (m) pill = `<span class="pill ok">✓ ${dShort(m.date)}</span>`;
      else if (before) pill = `<span class="pill">desde ${dShort(S.startFrom)}</span>`;
      else pill = `<span class="pill due">vence ${dShort(due)}</span>`;
      const act = !(f.amount > 0) ? `data-act="editfixed" data-id="${f.id}"` : (!m && !before ? `data-act="payfixed" data-id="${f.id}"` : '');
      return `<div class="row ${act ? 'tap' : ''}" ${act}><i class="dot" style="background:${colorOf(f.category)}"></i><div class="t"><b>${esc(f.name)}</b><span>${esc(f.method)}</span></div>${pill}<div class="amt">${f.amount > 0 ? fmt(f.amount) : '—'}</div></div>`;
    }).join('')}</div>`;
  }

  return `<header class="top"><div><div class="sub">${cur ? `${DAYS_L[now.getDay()]}, ${now.getDate()} de ${MONTHS_L[now.getMonth()]}` : 'Mes de ' + c.monthL + ' ' + c.year}</div><h1>Finanzas</h1></div>${cycleNav()}</header>
  ${firstUse}${pend}${now2}
  <div class="grid2">
    <div class="card kpi"><div class="lbl">Ingresos del mes</div><div class="v">${fmtH(t.inc)}</div>${t.food ? `<div class="note">incl. ${fmt(t.food, 0)} alimentos</div>` : ''}</div>
    <div class="card kpi"><div class="lbl">Gastos del mes</div><div class="v">${fmtH(t.exp)}</div><div class="note">balance <span style="color:${t.left < 0 ? 'var(--red)' : 'var(--text)'}">${fmt(t.left, 0)}</span></div></div>
  </div>
  ${cur ? `<div class="sub" style="margin:-4px 4px 12px">Tu mes va del ${c.label.replace(' – ', ' al ')} · ${daysLeft(c).toLowerCase()}</div>` : ''}
  <div class="card"><h2>Tarjeta de crédito <button data-act="goto" data-v="deudas">Detalle</button></h2>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><div><div class="sub">consumo hasta el ${dShort(ci.cur.close)}</div><div class="big" style="font-size:26px">${fmtH(cb)}</div></div>
      <div class="sub" style="text-align:right">${cb > S.card.cap ? `<span style="color:var(--red)">te pasaste ${fmt(cb - S.card.cap, 0)}</span>` : `quedan ${fmt(S.card.cap - cb, 0)}<br>de tu tope ${fmt(S.card.cap, 0)}`}</div></div>
    <div class="bar ${capPct > 100 ? 'over' : capPct >= 80 ? 'warn' : ''}"><i style="width:${Math.min(100, capPct)}%"></i></div>
    ${ci.due.length ? `<div class="note mt8" style="color:var(--amber);font-size:13px">Por pagar: ${fmt(ci.due[0].left, 0)} ${payTxt(ci.due[0])}</div>` : ''}
    ${cardTimeline()}
  </div>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="lbl">Tarjeta alimentos</div><div class="sub">solo súper y comidas</div></div><div class="big" style="font-size:22px;${fb < 0 ? 'color:var(--red)' : ''}">${fmtH(fb)}</div></div>
  <div class="card"><h2>Gastos por categoría</h2>${donut(t.byCat, t.exp)}</div>
  <div class="card"><h2>Últimos 6 meses</h2>${bars()}</div>
  ${fx}
  <div class="card"><h2>Movimientos del mes <button data-act="goto" data-v="movs">Ver todos</button></h2>${recent.length ? recent.map(movRow).join('') : `<div class="empty">Toca <b>+</b> para añadir tu primer movimiento.</div>`}</div>`;
}
function daysLeft(c) {
  const n = Math.round((parse(c.end) - parse(todayISO())) / 864e5) + 1;
  return n === 1 ? 'Último día' : `Faltan ${n} días`;
}

/* ---------- Movimientos ---------- */
function vMovs() {
  const c = cycle(off);
  let list = S.movements.filter(m => inCycle(m, c));
  if (movFilter === 'gastos') list = list.filter(m => m.type === 'gasto');
  if (movFilter === 'ingresos') list = list.filter(m => m.type === 'ingreso');
  if (movFilter === 'tarjeta') list = list.filter(m => m.method === 'Tarjeta de crédito' || m.type === 'pago_tarjeta');
  list.sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  const groups = {}; list.forEach(m => (groups[m.date] = groups[m.date] || []).push(m));
  const f = (v, l) => `<button class="chip ${movFilter === v ? 'on' : ''}" data-act="mfilter" data-v="${v}">${l}</button>`;
  return `<header class="top"><div><div class="sub">Mes de ${c.monthL}</div><h1>Movimientos</h1></div>${cycleNav()}</header>
  <div class="chips" style="margin-bottom:12px">${f('todos', 'Todos')}${f('gastos', 'Gastos')}${f('ingresos', 'Ingresos')}${f('tarjeta', 'Tarjeta crédito')}</div>
  <div class="card">${list.length ? Object.entries(groups).map(([d, ms]) => {
    const dd = parse(d); return `<div class="daygroup">${DAYS_L[dd.getDay()]} ${dd.getDate()} ${MONTHS[dd.getMonth()]}</div>${ms.map(movRow).join('')}`;
  }).join('') : '<div class="empty">No hay movimientos aquí.</div>'}</div>`;
}

/* ---------- Deudas ---------- */
function vDeudas() {
  const L = S.loan, ls = loanState();
  const paidPct = L.original > 0 ? (1 - ls.cap / L.original) * 100 : 0;
  const ci = cardInfo(), capPct = ci.open.amount / S.card.cap * 100;
  const today0 = todayISO(), sch = cardSchedule().filter(p => p.close >= today0).slice(0, 3);
  const twoCuotas = L.cuota * 2;
  return `<header class="top"><div><div class="sub">Crédito y tarjeta</div><h1>Deudas</h1></div></header>
  <div class="card"><h2>${esc(L.name)} <button data-act="goto" data-v="ajustes">Actualizar</button></h2>
    ${ls.cap > 0 ? `<div class="lbl">Capital pendiente (aprox.)</div><div class="big">${fmtH(ls.cap)}</div>
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, paidPct))}%"></i></div>
    <div class="stats">
      <div><span>Cuota</span><b>${fmt(L.cuota)}</b></div>
      <div><span>Cuotas restantes</span><b>${ls.n}</b></div>
      <div><span>Próximo pago</span><b>${dShort(ls.next)}</b></div>
      <div><span>Tasa (TEA)</span><b>${L.tea.toFixed(2)}%</b></div>
    </div>
    <div class="info mt">Si solo pagas las cuotas, pagarás <b>${fmt(ls.n * L.cuota, 0)}</b> en total: unos <b>${fmt(ls.n * L.cuota - ls.cap, 0)}</b> más de lo que debes hoy en intereses y cargos.</div>
    <div class="cta mt"><button class="btn gold" data-act="loanpay" data-v="cuota">Registrar cuota</button><button class="btn outline" data-act="loanpay" data-v="anticipado">Pago anticipado</button></div>`
    : `<div class="big" style="color:var(--green)">¡Pagado! 🎉</div><div class="sub mt8">Pide tu constancia de no adeudo al banco.</div>`}
  </div>
  ${ls.cap > 0 ? `<div class="card"><h2>¿Y si adelanto cada mes?</h2>
    <div class="sub">Extra mensual además de la cuota</div>
    <div class="big" id="simExtra" style="font-size:28px;margin-top:4px">S/ 0</div>
    <input type="range" id="simRange" min="0" max="2000" step="50" value="${simExtra}">
    <div id="simOut"></div>
    <div class="info mt">Para que el banco lo descuente del capital y te baje intereses:<br>
      • Paga en una sola vez <b>más de 2 cuotas</b> (más de ${fmt(twoCuotas)}, contando la del mes). Si pagas menos, lo toman como <i>adelanto de cuotas</i> y no te ahorras intereses, salvo que pidas expresamente que vaya a capital.<br>
      • Elige <b>reducir el plazo</b> (mantener la cuota): es lo que más intereses ahorra.<br>
      • Pide tu nuevo cronograma y actualiza aquí el capital en Ajustes.</div>
  </div>` : ''}
  <div class="card"><h2>Tarjeta de crédito <button data-act="goto" data-v="ajustes">Actualizar</button></h2>
    ${cardTimeline()}
    <div class="lbl mt">Consumo del ${dShort(ci.cur.start)} al ${dShort(ci.cur.close)}</div><div class="big">${fmtH(ci.open.amount)}</div>
    <div class="bar ${capPct > 100 ? 'over' : capPct >= 80 ? 'warn' : ''}"><i style="width:${Math.min(100, capPct)}%"></i></div>
    <div class="stats">
      <div><span>Tu tope</span><b>${fmt(S.card.cap, 0)}</b></div>
      <div><span>${ci.open.amount > S.card.cap ? 'Te pasaste' : 'Te queda para tu tope'}</span><b style="color:${ci.open.amount > S.card.cap ? 'var(--red)' : 'var(--text)'}">${fmt(Math.abs(S.card.cap - ci.open.amount), 0)}</b></div>
      <div><span>Cierra</span><b>${dShort(ci.cur.close)}</b></div>
      <div><span>Lo pagas</span><b>${S.card.payMode === 'banco' ? dShort(ci.cur.pay) : 'con tu sueldo ~' + dShort(plannedPay(ci.cur))}</b></div>
      <div><span>Vence (banco)</span><b>${dShort(ci.cur.pay)}${ci.cur.approx ? ' (aprox.)' : ''}</b></div>
    </div>
    ${ci.due.length ? `<span class="f-lbl">Estados de cuenta por pagar</span>${ci.due.map(s => `<div class="row"><i class="dot" style="background:${s.pay < todayISO() ? 'var(--red)' : 'var(--amber)'}"></i><div class="t"><b>Pagar ${payTxt(s)}</b><span>consumos del ${dShort(s.start)} al ${dShort(s.close)} · ${s.pay < todayISO() ? 'VENCIDO el ' : 'vence '}${dShort(s.pay)}</span></div><div class="amt">${fmt(s.left)}</div></div>`).join('')}` : ''}
    <div class="stats" style="border-top:1px solid var(--line);padding-top:12px">
      <div><span>Deuda total</span><b>${fmt(ci.total)}</b></div>
      <div><span>Línea disponible</span><b>${fmt(S.card.limit - ci.total, 0)} <span style="display:inline;color:var(--muted)">de ${fmt(S.card.limit, 0)}</span></b></div>

/* ---------- Análisis ---------- */
let anaRange = 6;
const METHOD_COLORS = { 'Efectivo': '#8a6a4a', 'Débito': '#4fa08f', 'Yape/Plin': '#8f7fc4', 'Tarjeta de crédito': '#e07b39', 'Tarjeta alimentos': '#e0b53a' };
const sumA = arr => arr.reduce((a, m) => a + m.amount, 0);
function cashAt(dateISO) {
  let b = 0;
  for (const m of S.movements) {
    if (m.date > dateISO) continue;
    if (m.type === 'ingreso' && m.category !== 'Tarjeta alimentos') b += m.amount;
    else if (m.type === 'gasto' && CASH.includes(m.method) && !m.goalId) b -= m.amount;
    else if (m.type === 'pago_tarjeta' || m.type === 'ahorro') b -= m.amount;
    else if (m.type === 'ajuste') b += m.amount;
  }
  return Math.round(b * 100) / 100;
}
// promedio de gasto mensual: últimos 3 meses completos con datos (si no hay, el mes actual)
function avgMonthly() {
  const vals = [-1, -2, -3].map(k => totals(cycle(k)).exp).filter(v => v > 0);
  const v = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : totals(cycle(0)).exp;
  // sin historial: tus fijos + ~S/ 45 al día como estimado
  return v > 0 ? v : S.fixed.filter(f => f.active && f.amount > 0).reduce((a, f) => a + f.amount, 0) + 45 * 30;
}
function goalSaved(g) {
  return Math.round((g.base + S.movements.filter(m => m.goalId === g.id && (m.type === 'ahorro' || m.type === 'gasto')).reduce((a, m) => a + (m.type === 'gasto' ? -m.amount : m.amount), 0)) * 100) / 100;
}
function ring(pct, size = 56, stroke = 7, color = 'var(--ink)', label = '') {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--ringbg)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C * p} ${C}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="50%" dy=".35em" text-anchor="middle" font-size="${size > 70 ? 17 : 12}" font-weight="700" fill="var(--text)">${label || Math.round(p * 100) + '%'}</text></svg>`;
}
function hbars(entries, colorFn, total) {
  if (!entries.length) return '<div class="empty">Sin datos en este periodo.</div>';
  const max = Math.max(...entries.map(e => e[1]));
  return entries.map(([k, v]) => `<div class="hb"><div class="hb-t"><span><i class="dot" style="background:${colorFn(k)}"></i>${esc(k)}</span><b>${fmt(v, 0)}<em>${total ? Math.round(v / total * 100) + '%' : ''}</em></b></div>
    <div class="hb-b"><i style="width:${Math.max(1.5, v / max * 100)}%;background:${colorFn(k)}"></i></div></div>`).join('');
}
function flowChart(rows) {
  const W = 340, H = 150, pad = 18, n = rows.length, max = Math.max(1, ...rows.map(r => Math.max(r.inc, r.exp)));
  const gw = (W - 10) / n, bw = Math.min(16, gw / 3);
  const y = v => H - pad - v / max * (H - pad - 14);
  let s = '';
  rows.forEach((r, i) => {
    const x = 5 + gw * i + gw / 2;
    s += `<rect x="${x - bw - 1}" y="${y(r.inc)}" width="${bw}" height="${H - pad - y(r.inc)}" rx="3" fill="var(--green)"/>`;
    s += `<rect x="${x + 1}" y="${y(r.exp)}" width="${bw}" height="${H - pad - y(r.exp)}" rx="3" fill="var(--ink)"/>`;
    s += `<text x="${x}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${r.c.month}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:6px">${s}<line x1="0" x2="${W}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line2)"/></svg>
    <div class="legend" style="grid-auto-flow:column;justify-content:start;gap:16px;margin-top:6px"><div><i style="background:var(--green)"></i><span>Ingresos</span></div><div><i style="background:var(--ink)"></i><span>Gastos</span></div></div>`;
}
function loanSeries(extra) {
  const L = S.loan, ls = loanState(); let b = ls.cap; const pts = [b]; const base = L.cuota - ls.cargos; let m = 0;
  while (b > 0.005 && m < 60) { m++; const i = b * ls.tem; const pay = Math.min(base, b + i); b = b + i - pay; if (b > 0 && extra > 0) b -= Math.min(extra, b); pts.push(Math.max(0, b)); }
  return pts;
}
function debtChart(extra) {
  const ls = loanState();
  if (ls.cap <= 0) return '<div class="empty">Tu crédito está pagado 🎉</div>';
  const a = loanSeries(0), b = loanSeries(extra), n = a.length, W = 340, H = 170, pl = 14, pb = 20, pt = 12;
  const x = i => pl + i / (n - 1) * (W - pl * 2), y = v => pt + (1 - v / a[0]) * (H - pt - pb);
  const path = s => s.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const start = parse(ls.next); let lab = '';
  for (let i = 0; i < n; i++) if (n <= 8 || i % 2 === 0 || i === n - 1) { const d = clampDate(start.getFullYear(), start.getMonth() + i - 1, 1); lab += `<text x="${x(i)}" y="${H - 4}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}" font-size="10" fill="var(--muted)">${i ? MONTHS[d.getMonth()] : 'hoy'}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:8px">
    <line x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line2)"/>
    <path d="${path(a)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
    ${extra > 0 ? `<path d="${path(b)}L${x(b.length - 1)},${H - pb}L${x(0)},${H - pb}Z" fill="color-mix(in srgb,var(--green) 14%,transparent)"/><path d="${path(b)}" fill="none" stroke="var(--green)" stroke-width="2.5"/>` : ''}
    <circle cx="${x(0)}" cy="${y(a[0])}" r="4" fill="var(--ink)"/>${lab}</svg>
    <div class="legend" style="grid-auto-flow:column;justify-content:start;gap:16px;margin-top:6px"><div><i style="background:var(--muted)"></i><span>Solo cuotas · ${a.length - 1} meses</span></div>${extra > 0 ? `<div><i style="background:var(--green)"></i><span>+${fmt(extra, 0)}/mes · ${b.length - 1} meses</span></div>` : ''}</div>`;
}
function vAnalisis() {

/* ---------- Ajustes ---------- */

let sheetCtx = null;
function movForm(m) {
  sheetCtx = { kind: 'mov', m: Object.assign({ type: 'gasto', amount: '', category: S.catsG[0], method: 'Débito', date: todayISO(), note: '' }, m) };
  drawMovForm();
}
function drawMovForm() {
  const m = sheetCtx.m, edit = !!m.id, isG = m.type === 'gasto';
  const cats = isG ? S.catsG : S.catsI;
  if (!cats.includes(m.category)) m.category = cats[0];
  const warn = isG && m.method === 'Tarjeta alimentos' && !FOOD_CATS.includes(m.category);
  const special = m.loan ? (m.loan === 'cuota' ? 'Cuota del crédito' : 'Pago anticipado al crédito') : null;
  openSheet(`<h3>${edit ? 'Editar movimiento' : special || 'Añadir movimiento'}<button data-act="close">Cerrar</button></h3>
    ${special ? '' : `<div class="seg"><button class="${isG ? 'on' : ''}" data-act="ftype" data-v="gasto">Gasto</button><button class="${!isG ? 'on' : ''}" data-act="ftype" data-v="ingreso">Ingreso</button></div>`}
    <input class="amount" id="f-amount" inputmode="decimal" placeholder="S/ 0.00" value="${m.amount === '' ? '' : m.amount}" autocomplete="off">
    ${special ? '' : `<span class="f-lbl">Categoría</span><div class="chips">${cats.map(c => `<button class="chip ${c === m.category ? 'on' : ''}" data-act="fcat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`}
    ${isG ? `<span class="f-lbl">Pagado con</span><div class="chips">${METHODS.map(x => `<button class="chip ${x === m.method ? 'on' : ''}" data-act="fmethod" data-v="${x}">${x}</button>`).join('')}</div>` : ''}
    ${isG && m.method === 'Tarjeta de crédito' ? `<div class="cardhint" id="cardHint">${cardHint(m.date)}</div>` : ''}
    ${warn ? `<div class="warnmsg">La tarjeta de alimentos solo sirve en supermercados y comida.</div>` : ''}
    ${(() => {
      if (!isG || special || !CASH.includes(m.method)) { m.goalId = undefined; return ''; }
      const gs = (S.goals || []).filter(g => goalSaved(g) > 0 || g.id === m.goalId);
      if (!gs.length) return '';
      const g = gs.find(x => x.id === m.goalId);
      const left = g ? goalSaved(g) + (edit && sheetCtx.orig === g.id ? sheetCtx.origAmt : 0) : 0;
      return `<span class="f-lbl">¿Sale de un ahorro?</span><div class="chips"><button class="chip ${!m.goalId ? 'on' : ''}" data-act="fgoal" data-v="">No, del día a día</button>${gs.map(x => `<button class="chip ${x.id === m.goalId ? 'on' : ''}" data-act="fgoal" data-v="${x.id}">${esc(x.name)} · ${fmt(goalSaved(x), 0)}</button>`).join('')}</div>
        ${g ? `<div class="cardhint">Se descuenta de <b>${esc(g.name)}</b> (tienes ${fmt(left)}). No baja tu gasto diario.</div>` : ''}`;
    })()}
    <span class="f-lbl">Fecha</span><input class="inp" type="date" id="f-date" value="${m.date}">
    <span class="f-lbl">Nota (opcional)</span><input class="inp" id="f-note" placeholder="ej. Plaza Vea, almuerzo, taxi…" value="${esc(m.note)}">
    <button class="btn gold block mt" data-act="fsave">${edit ? 'Guardar cambios' : 'Añadir'}</button>
    ${edit ? `<button class="btn danger block mt8" data-act="fdelete">Eliminar</button>` : ''}`);
  if (!edit) setTimeout(() => $('#f-amount')?.focus(), 260);
}

function avgCat(c) {
  const vals = [-1, -2, -3].map(k => totals(cycle(k)).byCat[c] || 0);
  const withData = [-1, -2, -3].filter(k => totals(cycle(k)).exp > 0).length;
  return withData ? vals.reduce((a, b) => a + b, 0) / withData : (totals(cycle(0)).byCat[c] || 0);
}
function goalForm(g) {
  const isNew = !g || !g.id;
  sheetCtx = { kind: 'goal', g: Object.assign({ id: 'g-' + uid(), name: '', target: '', base: 0, deadline: '' }, g || {}), isNew };
  const x = sheetCtx.g;
  openSheet(`<h3>${isNew ? (x.emergency ? 'Fondo de emergencia' : 'Nueva meta') : esc(x.name)}<button data-act="close">Cerrar</button></h3>
    ${x.emergency ? '' : `<span class="f-lbl">Nombre</span><input class="inp" id="g-name" value="${esc(x.name)}" placeholder="ej. Viaje, laptop, adelanto del crédito">`}
    ${x.emergency ? `<input type="hidden" id="g-name" value="Fondo de emergencia"><span class="f-lbl">¿Cuántos meses de gastos quieres cubrir?</span>
      <select class="inp" id="g-months">${[3, 4, 6].map(m => `<option value="${m}" ${x.months === m ? 'selected' : ''}>${m} meses (${fmt(avgMonthly() * m, 0)})</option>`).join('')}</select>` : ''}
    <div class="f2"><div><span class="f-lbl">Objetivo (S/)</span><input class="inp" id="g-target" inputmode="decimal" value="${x.target || ''}" placeholder="0.00"></div>
    <div><span class="f-lbl">Ya ahorrado en otra cuenta</span><input class="inp" id="g-saved" inputmode="decimal" value="${isNew ? '' : goalSaved(x)}" placeholder="0.00"></div></div>
    ${x.emergency ? '' : `<span class="f-lbl">Fecha meta (opcional)</span><input class="inp" type="date" id="g-date" value="${x.deadline || ''}">`}
    <button class="btn gold block mt" data-act="goalsave">Guardar</button>
    ${isNew ? '' : `<button class="btn outline block mt8" data-act="goaladd" data-id="${x.id}">Aportar o retirar</button><button class="btn danger block mt8" data-act="goaldelete">Eliminar</button>`}`);
  if ($('#g-months')) $('#g-months').addEventListener('change', e => { $('#g-target').value = Math.round(avgMonthly() * Number(e.target.value) / 100) * 100; });
}

/* ================= Acciones ================= */
function download(name, text, type) {
  const file = new File([text], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: name }).catch(() => {});
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportCSV() {
  const rows = [['Fecha', 'Tipo', 'Categoría', 'Método', 'Monto', 'Meta', 'Nota']];
  [...S.movements].sort((a, b) => a.date.localeCompare(b.date)).forEach(m =>
    rows.push([m.date, m.type === 'pago_tarjeta' ? 'pago tarjeta' : m.type, m.category || '', m.method || '', (m.type === 'ingreso' || m.type === 'ajuste' ? m.amount : -m.amount).toFixed(2), m.goalId ? ((S.goals || []).find(g => g.id === m.goalId) || {}).name || '' : '', m.note || '']));
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  download(`finanzas-${todayISO()}.csv`, csv, 'text/csv');
}

const actions = {
  prev() { off--; render(); },
  next() { if (off < 0) { off++; render(); } },
  goto(el) { tab = el.dataset.v; off = tab === 'movs' || tab === 'inicio' ? off : 0; render(); window.scrollTo(0, 0); },
  mfilter(el) { movFilter = el.dataset.v; render(); },
  close: closeSheet,
  edit(el) {
    const m = S.movements.find(x => x.id === el.dataset.id); if (!m) return;
    if (m.type === 'ajuste' || m.type === 'ahorro') {
      if (confirm(m.type === 'ahorro' ? '¿Eliminar este movimiento de ahorro?' : '¿Eliminar este ajuste de saldo?')) { S.movements = S.movements.filter(x => x.id !== m.id); save(); render(); toast('Eliminado'); }
      return;
    }
    if (m.type === 'pago_tarjeta') cardPayForm({ ...m }); else { movForm({ ...m }); sheetCtx.orig = m.goalId; sheetCtx.origAmt = m.amount; drawMovForm(); }
  },
  income(el) {
    const i = S.incomes.find(x => x.id === el.dataset.id), early = el.dataset.next === '1', c = cycle(early ? 1 : 0);
    movForm({ type: 'ingreso', amount: i.amount, category: i.category, incomeId: i.id, cycleKey: c.key,
      date: early ? c.start : todayISO(), note: early ? 'depositado el ' + dShort(todayISO()) : (i.name === i.category ? '' : i.name) });
  },
  payfixed(el) {
    const f = S.fixed.find(x => x.id === el.dataset.id); const c = cycle(0);
    movForm({ type: 'gasto', amount: f.amount, category: f.category, method: f.method, note: f.name, fixedId: f.id, cycleKey: c.key, ...(f.loan ? { loan: 'cuota' } : {}) });
  },
  loanpay(el) {
    const v = el.dataset.v;
    movForm({ type: 'gasto', category: 'Deudas', method: 'Débito', loan: v, amount: v === 'cuota' ? S.loan.cuota : '', note: v === 'cuota' ? 'Cuota ' + S.loan.name : 'Pago anticipado ' + S.loan.name });
  },
  cardpay() { cardPayForm(); },
  anarange(el) { anaRange = Number(el.dataset.v); render(); },
  budgets() {
    sheetCtx = { kind: 'budget' };
    const B = S.budgets || {};
    openSheet(`<h3>Presupuesto mensual<button data-act="close">Cerrar</button></h3>
      <div class="sub">Pon un tope a las categorías que quieras controlar. Deja en blanco las que no.</div>
      ${S.catsG.map(c => `<div class="setrow"><label for="b-${esc(c)}"><i class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:${colorOf(c)}"></i>${esc(c)}<br><span class="sub">promedio ${fmt(avgCat(c), 0)}/mes</span></label><input class="inp" id="b-${esc(c)}" data-cat="${esc(c)}" inputmode="decimal" placeholder="—" value="${B[c] > 0 ? B[c] : ''}"></div>`).join('')}
      <button class="btn gold block mt" data-act="budgetsave">Guardar</button>`);
  },
  budgetsave() {
    const B = {};
    document.querySelectorAll('#sheetBody input[data-cat]').forEach(i => { const v = num(i.value); if (v > 0) B[i.dataset.cat] = v; });
    S.budgets = B; save(); closeSheet(); render(); toast('Presupuesto guardado');
  },
  budgetsavg() {
    const B = {};
    S.catsG.forEach(c => { const v = avgCat(c); if (v > 0) B[c] = Math.ceil(v / 10) * 10; });
    if (!Object.keys(B).length) { toast('Aún no hay gastos para sacar un promedio'); return; }
    S.budgets = B; save(); actions.budgets(); toast('Puse tu promedio: ajústalo si quieres');
  },
  goalnew() { goalForm(); },
  efnew() { goalForm({ name: 'Fondo de emergencia', emergency: true, months: 3, target: Math.round(avgMonthly() * 3 / 100) * 100 }); },
  goaledit(el) { goalForm({ ...S.goals.find(g => g.id === el.dataset.id) }); },
  goalsave() {
    const g = sheetCtx.g;
    g.name = $('#g-name').value.trim() || 'Meta'; g.target = num($('#g-target').value) || 0;
    const saved = num($('#g-saved').value) || 0;
    g.base = Math.round((g.base + saved - goalSaved(g)) * 100) / 100;
    g.deadline = $('#g-date') ? $('#g-date').value : ''; if ($('#g-months')) g.months = parseInt($('#g-months').value) || 3;
    if (!(g.target > 0)) { toast('Pon un monto objetivo'); return; }
    const i = S.goals.findIndex(x => x.id === g.id); if (i >= 0) S.goals[i] = g; else S.goals.push(g);
    save(); closeSheet(); render(); toast('Meta guardada');
  },
  goaldelete() {
    if (!confirm('¿Eliminar esta meta? Los aportes registrados se borran también.')) return;
    const id = sheetCtx.g.id; S.goals = S.goals.filter(g => g.id !== id); S.movements = S.movements.filter(m => !(m.type === 'ahorro' && m.goalId === id));
    S.movements.forEach(m => { if (m.goalId === id) delete m.goalId; });
    save(); closeSheet(); render();
  },
  goaladd(el) {
    const g = S.goals.find(x => x.id === el.dataset.id);
    sheetCtx = { kind: 'aporte', g, sign: 1 };
    openSheet(`<h3>${esc(g.name)}<button data-act="close">Cerrar</button></h3>
      <div class="seg"><button class="on" data-act="aposign" data-v="1">Aportar</button><button data-act="aposign" data-v="-1">Retirar</button></div>
      <input class="amount" id="f-apo" inputmode="decimal" placeholder="S/ 0.00" autocomplete="off">
      <div class="sub">Llevas ${fmt(goalSaved(g))} de ${fmt(g.target)}. El aporte sale de tu saldo disponible (lo pasas a tu cuenta de ahorro); no cuenta como gasto.</div>
      <button class="btn gold block mt" data-act="aposave">Guardar</button>`);
    setTimeout(() => $('#f-apo')?.focus(), 260);
  },
  aposign(el) { sheetCtx.sign = Number(el.dataset.v); el.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); },
  aposave() {
    const v = num($('#f-apo').value); if (!(v > 0)) { toast('Escribe un monto'); return; }
    const sign = sheetCtx.sign;
    S.movements.push({ id: uid(), type: 'ahorro', goalId: sheetCtx.g.id, amount: v * sign, date: todayISO(), created: Date.now() });
    save(); closeSheet(); render(); toast(sign === -1 ? 'Retiro registrado' : 'Aporte registrado');
  },
  setcash() {
    sheetCtx = { kind: 'cash' };
    openSheet(`<h3>¿Cuánto tienes ahora?<button data-act="close">Cerrar</button></h3>
      <div class="sub">Suma tu efectivo, lo que hay en tu cuenta y en Yape/Plin. No incluyas la tarjeta de alimentos ni la de crédito.</div>
      <input class="amount mt" id="f-cash" inputmode="decimal" placeholder="S/ 0.00" value="${cashBalance() > 0 ? cashBalance() : ''}" autocomplete="off">
      <div class="sub">La diferencia se guarda como "ajuste de saldo": no cuenta como gasto ni como ingreso.</div>
      <button class="btn gold block mt" data-act="cashsave">Guardar saldo</button>`);
    setTimeout(() => { const i = $('#f-cash'); i?.focus(); i?.select(); }, 260);
  },
  cashsave() {
    const v = num($('#f-cash').value);
    if (!(v >= 0)) { toast('Escribe un monto'); return; }
    const diff = Math.round((v - cashBalance()) * 100) / 100;
    if (diff !== 0) S.movements.push({ id: uid(), type: 'ajuste', amount: diff, date: todayISO(), created: Date.now() });
    save(); closeSheet(); render(); toast('Saldo actualizado');
  },
  ftype(el) { readMovForm(); sheetCtx.m.type = el.dataset.v; drawMovForm(); },
  fcat(el) { readMovForm(); sheetCtx.m.category = el.dataset.v; drawMovForm(); },
  fgoal(el) { readMovForm(); sheetCtx.m.goalId = el.dataset.v || undefined; drawMovForm(); },
  fmethod(el) {
    if (sheetCtx.kind === 'card') { sheetCtx.m.method = el.dataset.v; el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)); return; }
    readMovForm(); sheetCtx.m.method = el.dataset.v;
    if (el.dataset.v === 'Tarjeta alimentos' && !FOOD_CATS.includes(sheetCtx.m.category)) sheetCtx.m.category = 'Supermercado';
    drawMovForm();
  },
  fsave() {
    const m = sheetCtx.m;
    m.amount = num($('#f-amount').value); m.date = $('#f-date').value || todayISO(); m.note = $('#f-note').value.trim();
    if (!(m.amount > 0)) { toast('Escribe un monto'); $('#f-amount').focus(); return; }
    if (m.type === 'ingreso') delete m.method;
    if (m.id) { const i = S.movements.findIndex(x => x.id === m.id); S.movements[i] = { ...m, auto: false }; toast('Guardado'); }
    else { S.movements.push({ ...m, id: uid(), created: Date.now() }); toast(m.type === 'ingreso' ? 'Ingreso añadido' : m.type === 'pago_tarjeta' ? 'Pago registrado' : 'Gasto añadido'); }
    save(); closeSheet(); render();
  },
  fdelete() {
    const m = sheetCtx.m;
    if (!confirm('¿Eliminar este movimiento?')) return;
    S.movements = S.movements.filter(x => x.id !== m.id);
    if (m.fixedId && m.cycleKey) S.skips.push(m.fixedId + '|' + m.cycleKey);
    save(); closeSheet(); render(); toast('Eliminado');
  },
  newfixed() { fixedForm(); },
  editfixed(el) { fixedForm({ ...S.fixed.find(f => f.id === el.dataset.id) }); },
  xcat(el) { readFixedForm(); sheetCtx.f.category = el.dataset.v; drawFixedForm(); },
  xmethod(el) { readFixedForm(); sheetCtx.f.method = el.dataset.v; drawFixedForm(); },
  xsave() {
    readFixedForm(); const f = sheetCtx.f;
    if (!f.name) { toast('Ponle un nombre'); return; }
    if (sheetCtx.isNew) S.fixed.push(f); else S.fixed[S.fixed.findIndex(x => x.id === f.id)] = f;
    save(); autoFixed(); closeSheet(); render(); toast('Gasto fijo guardado');
  },
  xdelete() {
    if (!confirm('¿Eliminar este gasto fijo? Los que ya se registraron se quedan.')) return;
    S.fixed = S.fixed.filter(x => x.id !== sheetCtx.f.id); save(); closeSheet(); render();
  },
  savetheme() {
    const df = $('#s-df').value, dt = $('#s-dt').value;
    if (/^\d\d:\d\d$/.test(df)) S.settings.darkFrom = df;
    if (/^\d\d:\d\d$/.test(dt)) S.settings.darkTo = dt;
    save(); render(); toast('Apariencia guardada');
  },
  savemonth() {
    const d = parseInt($('#s-day').value);
    if (d >= 1 && d <= 31) S.settings.cycleDay = d;
    S.incomes.forEach(i => { const v = num($('#inc-' + i.id).value); if (v >= 0) i.amount = v; });
    save(); render(); toast('Guardado');
  },
  savecard() {
    const l = num($('#c-limit').value), c = num($('#c-cap').value), o = num($('#c-open').value), pv = num($('#c-prev').value);
    if (l > 0) S.card.limit = l; if (c > 0) S.card.cap = c;
    S.card.payMode = $('#c-mode').value;
    const ci = cardInfo(), dueNow = Math.round(ci.due.reduce((a, s) => a + s.left, 0) * 100) / 100;
    if (o >= 0 && pv >= 0 && (o !== ci.open.amount || pv !== dueNow)) {
      const sch = cardSchedule(), idx = sch.findIndex(p => p.close === ci.cur.close);
      Object.assign(S.card, { openBase: o, openClose: ci.cur.close, prevBase: pv, prevClose: (sch[idx - 1] || ci.cur).close, baseAt: Date.now() });
    }
    save(); render(); toast('Tarjeta actualizada');
  },
  savefood() {
    const b = num($('#a-bal').value);
    if (b >= 0 && b !== foodBalance()) { S.food.base = b; S.food.baseAt = Date.now(); }
    save(); render(); toast('Saldo actualizado');
  },
  saveloan() {
    const L = S.loan;
    const vals = { original: num($('#l-orig').value), capital: num($('#l-cap').value), tea: num($('#l-tea').value), cuota: num($('#l-cuota').value), cuotas: parseInt($('#l-n').value) };
    if (!(vals.capital >= 0) || !(vals.tea >= 0) || !(vals.cuota > 0) || !(vals.cuotas >= 0)) { toast('Revisa los datos'); return; }
    Object.assign(L, vals, { name: $('#l-name').value.trim() || 'Crédito', next: $('#l-next').value || L.next, baseAt: Date.now() });
    save(); render(); toast('Crédito actualizado');
  },
  delcat(el) {
    const c = el.dataset.v; if (S.catsG.length <= 1) return;
    if (!confirm(`¿Quitar la categoría "${c}"? Los gastos que ya tienes no se borran.`)) return;
    S.catsG = S.catsG.filter(x => x !== c); save(); render();
  },
  addcat() {
    const v = $('#newcat').value.trim(); if (!v) return;
    if (S.catsG.some(c => c.toLowerCase() === v.toLowerCase())) { toast('Ya existe'); return; }
    S.catsG.splice(Math.max(0, S.catsG.length - 1), 0, v); save(); render(); toast('Categoría añadida');
  },
  export() { download(`finanzas-copia-${todayISO()}.json`, JSON.stringify(S, null, 1), 'application/json'); },
  csv: exportCSV,
  import() { $('#importFile').click(); },
  reset() {
    if (!confirm('¿Borrar TODOS tus datos? Exporta una copia antes si la quieres guardar.')) return;
    if (!confirm('Seguro? Esto no se puede deshacer.')) return;
    localStorage.removeItem(KEY); load(); off = 0; tab = 'inicio'; render(); toast('Datos borrados');
  }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; if (tab === 'deudas' || tab === 'ajustes' || tab === 'analisis') off = 0; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest('[data-act]');
  if (a && actions[a.dataset.act]) { e.preventDefault(); actions[a.dataset.act](a); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'simRange') updateSim();
  if (e.target.id === 'anaExtra') { const v = Number(e.target.value); S.settings.extraPlan = v; $('#anaExtraTxt').textContent = fmt(v, 0); $('#debtChart').innerHTML = debtChart(v); clearTimeout(save.t); save.t = setTimeout(save, 400); }
  if (e.target.id === 'f-date' && $('#cardHint')) $('#cardHint').innerHTML = cardHint(e.target.value);
});
document.addEventListener('change', e => { if (e.target.id === 'f-date' && $('#cardHint')) $('#cardHint').innerHTML = cardHint(e.target.value); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && sheetCtx && e.target.tagName === 'INPUT') { e.preventDefault(); ({ fixed: actions.xsave, cash: actions.cashsave, budget: actions.budgetsave, goal: actions.goalsave, aporte: actions.aposave }[sheetCtx.kind] || actions.fsave)(); } });
$('#scrim').addEventListener('click', closeSheet);
$('#fab').addEventListener('click', () => movForm({ date: off === 0 ? todayISO() : cycle(off).end }));
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.movements) || !d.settings) throw new Error('formato');
    if (!confirm(`¿Reemplazar tus datos con esta copia (${d.movements.length} movimientos)?`)) return;
    S = d; S.skips = S.skips || []; save(); render(); toast('Copia importada');
  } catch (err) { toast('Ese archivo no es una copia válida'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (autoFixed()) toast('Gastos fijos registrados'); render(); } });

load();
const n0 = autoFixed();
render();
setInterval(applyTheme, 30000);
if (n0) toast(n0 === 1 ? '1 gasto fijo registrado' : n0 + ' gastos fijos registrados');
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  // busca versión nueva al abrir y cada vez que vuelves a la app; si llega una, recarga sola una vez
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded && !sheetCtx) { reloaded = true; location.reload(); }
    hadController = true;
  });
}
</script>
</body>
</html>
